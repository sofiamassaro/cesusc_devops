# Proxy reverso: o Nginx recebe na porta 80 (liberada no Security Group)
# e repassa para a aplicação no container, que escuta na porta 3000.
server {
    listen 80;
    server_name _;   # troque por seu IP fixo (Elastic IP) ou domínio, se quiser

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
