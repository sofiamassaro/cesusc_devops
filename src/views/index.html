<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projeto DevOps</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0;
           display: flex; min-height: 100vh; align-items: center; justify-content: center; margin: 0; }
    main { max-width: 560px; padding: 32px; background: #1e293b; border-radius: 12px; }
    h1 { margin-top: 0; color: #38bdf8; }
    li { margin: 6px 0; }
    code { background: #0f172a; padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>Projeto DevOps</h1>
    <p>Aplicação publicada automaticamente pelo pipeline:</p>
    <ul>
      <li>CI: lint (ESLint) e testes (Jest) na branch <code>develop</code></li>
      <li>Continuous Delivery: merge automático na <code>main</code></li>
      <li>Continuous Deployment: imagem Docker no Docker Hub e deploy na AWS EC2</li>
    </ul>
    <p>Versão 1.0</p>
  </main>
</body>
</html>
