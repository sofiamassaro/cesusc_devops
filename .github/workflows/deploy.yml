# Continuous Deployment
# - Roda a cada push na main (feito automaticamente pelo job "delivery" do CI)
# - Job "docker": gera a imagem e envia para o Docker Hub com duas tags: SHA do commit e latest
# - Job "deploy": copia o docker-compose.yaml para a EC2, baixa a imagem nova e reinicia o container
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ${{ secrets.DOCKER_USERNAME }}/projeto-devops

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e push da imagem
        run: |
          docker build . --file Dockerfile --tag $IMAGE:${{ github.sha }}
          docker tag $IMAGE:${{ github.sha }} $IMAGE:latest
          docker push -a $IMAGE

  deploy:
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Copiar docker-compose.yaml para a EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: docker-compose.yaml
          target: /opt/projeto-devops

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/projeto-devops
            export DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
            docker compose pull
            docker compose up -d
            # Limpeza: remove imagens antigas para não lotar o disco da EC2
            docker image prune -f
